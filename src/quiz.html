<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문제 풀기 — CS 면접 교재</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="quiz-page">
  <div id="quiz-app">

    <header id="quiz-header">
      <a href="../index.html" class="back-btn">← 교재로</a>
      <div class="quiz-title">
        <div id="quiz-chapter-name">챕터 로딩 중...</div>
        <div id="quiz-vol-name"></div>
      </div>
      <div id="quiz-score-display"></div>
    </header>

    <div id="quiz-body">

      <div id="quiz-loading">
        <div class="spinner"></div>
        <p>문제 불러오는 중...</p>
      </div>

      <div id="quiz-card-area" style="display:none">
        <div class="quiz-progress-bar">
          <div id="quiz-progress-fill"></div>
        </div>

        <div class="quiz-counter">
          <span id="quiz-current-num">1</span>
          <span style="color:#94a3b8"> / </span>
          <span id="quiz-total-num">0</span>
          <span class="quiz-type-badge" id="quiz-type-badge"></span>
        </div>

        <div id="quiz-card">
          <div class="question-text" id="quiz-question"></div>

          <!-- 내 답변 입력 영역 -->
          <div class="user-answer-section">
            <div class="answer-label">내 답변</div>
            <textarea id="user-answer" placeholder="면접관이라면 어떻게 답변할지 적어보세요..." rows="4"></textarea>
          </div>

          <!-- 모범 답변 (비교 버튼 클릭 후 공개) -->
          <div id="answer-area" style="display:none">
            <div class="answer-label model-label">모범 답변</div>
            <div class="answer-text" id="quiz-answer"></div>
          </div>

          <div class="quiz-actions">
            <button id="reveal-btn" class="reveal-btn">모범 답변과 비교하기 👁</button>
            <div id="rating-btns" style="display:none">
              <button class="rating-btn knew" id="btn-knew">✓ 알고 있었음</button>
              <button class="rating-btn didnt" id="btn-didnt">✗ 몰랐음</button>
            </div>
          </div>
        </div>

        <div class="keyboard-hint" id="keyboard-hint">
          <kbd>Space</kbd> 비교하기 &nbsp;·&nbsp; <kbd>←</kbd> 몰랐음 &nbsp;·&nbsp; <kbd>→</kbd> 알았음
        </div>
      </div>

      <!-- 결과 요약 -->
      <div id="quiz-summary" style="display:none">
        <div class="summary-icon">🎉</div>
        <h2>퀴즈 완료!</h2>
        <div class="summary-stats">
          <div class="stat-card good">
            <div class="stat-num" id="stat-knew">0</div>
            <div class="stat-label">알고 있었음</div>
          </div>
          <div class="stat-card bad">
            <div class="stat-num" id="stat-didnt">0</div>
            <div class="stat-label">다시 공부</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" id="stat-score">0%</div>
            <div class="stat-label">정답률</div>
          </div>
        </div>
        <div class="summary-actions">
          <button class="restart-btn" id="restart-btn">다시 풀기 ↺</button>
          <a href="../index.html" class="back-btn-large">교재로 돌아가기</a>
        </div>
      </div>

    </div>
  </div>

  <script src="quiz.js"></script>
</body>
</html>
